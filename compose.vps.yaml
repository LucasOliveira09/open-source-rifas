services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rifas_iracema
      POSTGRES_USER: rifas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.vps}
    volumes:
      - rifas-vps-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifas -d rifas_iracema"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/rifas_iracema
      DATABASE_USERNAME: rifas
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.vps}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-}
      PIX_EXPIRATION: ${PIX_EXPIRATION:-PT24H}
      PIX_BUYER_EMAIL: ${PIX_BUYER_EMAIL:-rifas@example.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  rifas-vps-data:

networks:
  internal:
    driver: bridge
