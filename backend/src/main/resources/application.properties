spring.application.name=rifas
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rifas_iracema}
spring.datasource.username=${DATABASE_USERNAME:rifas}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:rifas_local_dev}}
spring.flyway.enabled=true
app.mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
app.mercado-pago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
app.mercado-pago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:}
app.pix.expiration=${PIX_EXPIRATION:PT24H}
app.pix.buyer-email=${PIX_BUYER_EMAIL:rifas@example.com}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ADMIN_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict
