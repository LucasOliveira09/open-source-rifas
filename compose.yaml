services:
  postgres:
    image: postgres:17
    container_name: rifas-iracema-postgres
    environment:
      POSTGRES_DB: rifas_iracema
      POSTGRES_USER: rifas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifas_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - rifas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifas -d rifas_iracema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rifas-postgres-data:
